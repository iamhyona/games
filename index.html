<!doctype html>

<style>
@font-face{font-family:"NeoDunggeunmo";src:url(https://cdn.jsdelivr.net/npm/@kfonts/neodgm@0.5.0/neodgm.woff2) format("woff2");font-display:swap}
:root{--bg:#0b0b0f;--line:#2c2d36;--line2:#363743;--txt:#f2f2f7;--sub:#8f90a0;--gold:#f2b000;--f:"NeoDunggeunmo",ui-monospace,monospace;--en:"Silkscreen",var(--f)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1c1d22;color:var(--txt);font-family:var(--f);-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
.ph{width:100%;max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column}
@media (min-width:520px){.ph{max-width:560px;border-radius:30px;margin:16px auto;min-height:calc(100vh - 32px);box-shadow:0 20px 50px rgba(0,0,0,.55);padding:14px 22px 34px}}
.hd{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 4px 14px;color:#c9c9d4;font-size:11px;letter-spacing:.1em;white-space:nowrap;font-family:var(--en)}
.rb{display:grid;grid-template-columns:repeat(21,4px);grid-template-rows:4px 4px;gap:1px;overflow:hidden;flex-shrink:1}.rb i{display:block}.rb.r{transform:scaleX(-1)}
@media (max-width:370px){.rb{grid-template-columns:repeat(14,4px)}}
.top{text-align:center;padding:14px 0 20px}
.logo{font-family:var(--en);font-weight:700;font-size:34px;letter-spacing:.06em;line-height:1.05;color:#fff;text-shadow:0 0 10px rgba(242,176,0,.55),0 0 24px rgba(242,176,0,.25)}
.logo b{display:block;color:var(--gold);font-size:15px;letter-spacing:.42em;margin-top:8px;text-shadow:none}
.lead{color:var(--sub);font-size:13px;margin-top:14px;line-height:1.6}
.list{display:flex;flex-direction:column;gap:12px}
.it{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;border:2px solid var(--line2);border-radius:16px;background:#141519;padding:16px 14px 16px 14px;transition:transform .12s,border-color .15s,box-shadow .15s}
.it:hover,.it:focus-visible{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 28%,transparent);outline:none}
.it:active{transform:scale(.985)}
.ic{flex-shrink:0;width:60px;height:60px;border-radius:14px;background:#1c1d26;border:2px solid color-mix(in srgb,var(--c) 45%,#2c2d36);display:grid;place-items:center;overflow:hidden}
.ic svg{width:48px;height:48px;display:block}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.nm{display:flex;align-items:baseline;gap:9px;min-width:0;flex-wrap:wrap}
.nm b{font-size:21px;word-break:keep-all;font-weight:400;color:#fff;white-space:nowrap;line-height:1.1}
.nm i{font-style:normal;font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--c);white-space:nowrap}
.ds{font-size:13px;color:#9d9eae;line-height:1.45;word-break:keep-all}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tg span{font-size:11px;color:#c9c9d4;border:1.5px solid #3a3b47;border-radius:7px;padding:3px 7px 2px;line-height:1.2}
.tg span.nw{color:var(--c);border-color:var(--c);font-family:var(--en);font-weight:700;font-size:9px;letter-spacing:.1em;padding:4px 6px 3px}
.pl{flex-shrink:0;font-family:var(--en);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--c);border:2.5px solid var(--c);border-radius:12px;padding:12px 11px 11px;background:color-mix(in srgb,var(--c) 10%,transparent)}
@media (max-width:370px){.ic{width:50px;height:50px}.ic svg{width:40px;height:40px}.nm b{font-size:18px}.pl{padding:10px 8px 9px;font-size:11px}}
.ft{text-align:center;color:#6c6d7c;font-size:11px;line-height:1.8;margin-top:28px}
.inst{margin:18px auto 0;font-size:11px;color:#8f90a0;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="ph">
  <div class="hd"><span class="rb" id="rb1"></span><span>© 2026 PARK HYONA</span><span class="rb r" id="rb2"></span></div>
  <div class="top">
    <div class="logo">PARK HYONA<b>GAMES</b></div>
    <div class="lead">박현아가 심심해서 만든 비상업적 게임 모음<br>골라서 플레이하세요!</div>
  </div>
  <div class="list" id="list"></div>
  <div class="inst" id="inst">공유 버튼 → 홈 화면에 추가하면<br>앱처럼 열리고 게임도 그 안에서 열려요</div>
  <div class="ft">모든 게임은 무료 · 비상업적 용도예요<br>휴대폰에서 가장 잘 돌아가요</div>
</div>
<script>
const G=[
 {id:"petris",en:"PETRIS",nm:"페트리스",c:"#7ad35a",ds:"게임보이 감성 블록 쌓기.",tg:["블록","대결","랭킹"]},
 {id:"switchpang",en:"SWITCH PANG",nm:"스위치팡",c:"#f2b000",ds:"옆 조각과 바꿔서 셋이면 팡!",tg:["퍼즐","대결","랭킹"]},
 {id:"fruitpang",en:"MARBLE PANG",nm:"구슬팡",c:"#ff6ec7",ds:"같은 구슬끼리 합쳐서 하트 구슬까지!",tg:["합체","퍼즐","랭킹"],nw:1},
 {id:"mines",en:"MINESWEEPER",nm:"지뢰찾기",c:"#6ea0ff",ds:"추억의 지뢰찾기.",tg:["클래식","랭킹"]},
 {id:"pang",en:"PANGYA PANGYA",nm:"팡야팡야",c:"#ff6b9a",ds:"같은 모양 넷이면 팡! 떨어지는 연쇄 퍼즐.",tg:["연쇄","퍼즐","대결"]},
 {id:"bricks",en:"BRICKS",nm:"벽돌깨기",c:"#46e09a",ds:"우주 벽돌깨기 · 아이템.",tg:["아케이드","아이템","랭킹"]},
 {id:"twinstar",en:"TWIN STAR",nm:"트윈스타",c:"#3fd0ff",ds:"둘이서 같은 하늘을 지키는 우주 슈팅.",tg:["슈팅","협동","랭킹"],nw:1},
 {id:"peekaboo",en:"PEEKABOO",nm:"틀린그림 · 숨은그림",c:"#8fd3ff",ds:"다른 곳 찾기와 숨은 물건 찾기.",tg:["찾기","랭킹"],nw:1},
 {id:"hangulbi",en:"HANGULBI",nm:"한글비타자게임",c:"#3fc9b0",ds:"헷갈리는 우리말이 비처럼!",tg:["타자","우리말"]}];
/* 게임마다 상징 그래픽 (도트 느낌) */
const blk=(x,y,c,s=8)=>`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="1.5" fill="${c}"/><rect x="${x+1.5}" y="${y+1.5}" width="${s-5}" height="2" fill="#fff" opacity=".45"/><rect x="${x}" y="${y+s-2}" width="${s}" height="2" fill="#000" opacity=".25"/>`;
const grid=(rows,pal,s=8,ox=0,oy=0)=>rows.map((r,y)=>[...r].map((ch,x)=>pal[ch]?blk(ox+x*s,oy+y*s,pal[ch],s):"").join("")).join("");
const mrb=(cx,cy,r,a,b)=>`<circle cx="${cx}" cy="${cy}" r="${r+1.6}" fill="#14102a"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${a}"/><circle cx="${cx+r*.25}" cy="${cy+r*.3}" r="${r*.62}" fill="${b}" opacity=".55"/><ellipse cx="${cx-r*.38}" cy="${cy-r*.5}" rx="${r*.32}" ry="${r*.17}" transform="rotate(-30 ${cx-r*.38} ${cy-r*.5})" fill="#fff" opacity=".9"/>`;
const eyes=(cx,cy,d,r)=>`<circle cx="${cx-d}" cy="${cy}" r="${r}" fill="#2a1712"/><circle cx="${cx+d}" cy="${cy}" r="${r}" fill="#2a1712"/>`;
const SYM={
 petris:grid(["......","...g..","..ggg.","y.....","yy..bb","ybrrbb"],{g:"#7ad35a",y:"#f2b000",b:"#3a8cff",r:"#ff5a6a"}),
 switchpang:`<rect x="3" y="3" width="19" height="19" rx="4" fill="#262838"/><rect x="26" y="3" width="19" height="19" rx="4" fill="#262838"/><rect x="3" y="26" width="19" height="19" rx="4" fill="#262838"/><rect x="26" y="26" width="19" height="19" rx="4" fill="#262838"/><circle cx="12.5" cy="12.5" r="6.5" fill="#ff5a6a"/><path d="M35.5 5.5l7 7-7 7-7-7z" fill="#f2b000"/><rect x="6.5" y="29.5" width="12" height="12" rx="2" fill="#3a8cff"/><path d="M35.5 29l7 12h-14z" fill="#46e09a"/><circle cx="10" cy="10" r="1.8" fill="#fff" opacity=".7"/>`,
 fruitpang:mrb(11,37,7,"#ff4d5e","#ffb3b8")+mrb(25,36,9,"#ffd93a","#fff4b0")+`<path d="M34 34C25 29 22 24 22 18.5C22 13.8 25.2 10.6 29 10.6C31.4 10.6 33.1 11.9 34 13.8C34.9 11.9 36.6 10.6 39 10.6C42.8 10.6 46 13.8 46 18.5C46 24 43 29 34 34Z" fill="#ff6ec7" stroke="#14102a" stroke-width="1.6"/><ellipse cx="28.5" cy="15" rx="3" ry="1.6" transform="rotate(-30 28.5 15)" fill="#fff" opacity=".9"/>`+eyes(34,20,2.6,1.3)+`<path d="M31.5 23.2q2.5 2.4 5 0" stroke="#2a1712" stroke-width="1.2" fill="none" stroke-linecap="round"/>`,
 mines:`<rect x="4" y="4" width="40" height="40" rx="3" fill="#262838"/><g stroke="#2f3245" stroke-width="1"><path d="M17.3 4v40M30.6 4v40M4 17.3h40M4 30.6h40"/></g><text x="10.6" y="15" font-family="Silkscreen,monospace" font-weight="700" font-size="10" fill="#6ea0ff" text-anchor="middle">1</text><text x="37.3" y="41.5" font-family="Silkscreen,monospace" font-weight="700" font-size="10" fill="#46e09a" text-anchor="middle">2</text><g transform="translate(24 24)"><path d="M0-9V9M-9 0H9M-6.4-6.4L6.4 6.4M6.4-6.4L-6.4 6.4" stroke="#e8e8f0" stroke-width="2" stroke-linecap="round"/><circle r="6.2" fill="#15161c" stroke="#e8e8f0" stroke-width="1.4"/><circle cx="-2" cy="-2" r="1.6" fill="#fff"/></g><path d="M34 6v10" stroke="#e8e8f0" stroke-width="1.5"/><path d="M34.7 6.5l6 2.6-6 2.6z" fill="#ff5a6a"/>`,
 pang:`<path d="M13 44C5 40 3 35.5 3 31C3 27 5.8 24.2 9.2 24.2C11.2 24.2 12.3 25.3 13 26.8C13.7 25.3 14.8 24.2 16.8 24.2C20.2 24.2 23 27 23 31C23 35.5 21 40 13 44Z" fill="#ff5a6a" stroke="#14102a" stroke-width="1.6"/><path d="M36 22C40.5 27 45 30 45 35C45 40 41 44 36 44C31 44 27 40 27 35C27 30 31.5 27 36 22Z" fill="#3e8fe6" stroke="#14102a" stroke-width="1.6"/><path d="M24 2.5l3.2 6.6 7.2 1-5.2 5 1.3 7.1L24 18.8l-6.5 3.4 1.3-7.1-5.2-5 7.2-1z" fill="#f6a51e" stroke="#14102a" stroke-width="1.6" stroke-linejoin="round"/>`+eyes(13,32,2.6,1.2)+eyes(36,35,2.6,1.2)+eyes(24,12.5,2.2,1.1),
 bricks:grid(["rrooyy","ggbbpp"],{r:"#ff5a6a",o:"#ff9a2e",y:"#ffd93a",g:"#46e09a",b:"#3a8cff",p:"#9a5cff"},8,0,4)+`<circle cx="27" cy="30" r="3.2" fill="#fff"/><rect x="15" y="40" width="20" height="4.5" rx="2" fill="#46e09a"/>`,
 twinstar:`<g fill="#3fd0ff"><path d="M24 3l4 9v12l9 7v5l-9-3v5l3 3v3l-7-2-7 2v-3l3-3v-5l-9 3v-5l9-7V12z"/></g><path d="M24 7l2 5v8h-4v-8z" fill="#e8fbff"/><path d="M21 43h6l-3 4z" fill="#ffb23a"/><circle cx="9" cy="10" r="1.2" fill="#fff"/><circle cx="41" cy="18" r="1" fill="#fff"/><circle cx="38" cy="6" r="1.4" fill="#ffd93a"/>`,
 peekaboo:`<circle cx="20" cy="20" r="13" fill="#20324a" stroke="#8fd3ff" stroke-width="4"/><path d="M14 16a7 7 0 0 1 7-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><path d="M29.5 29.5l11 11" stroke="#8fd3ff" stroke-width="6.5" stroke-linecap="round"/><path d="M20 14.5l1.7 3.6 3.9.5-2.9 2.7.8 3.9-3.5-1.9-3.5 1.9.8-3.9-2.9-2.7 3.9-.5z" fill="#ffd93a"/>`,
 hangulbi:`<g font-family="NeoDunggeunmo,monospace" font-size="15" text-anchor="middle"><text x="11" y="17" fill="#3fc9b0">한</text><text x="25" y="31" fill="#ffd93a">글</text><text x="38" y="45" fill="#ff6ec7">비</text></g><g stroke="#8fd3ff" stroke-width="1.6" stroke-linecap="round" opacity=".7"><path d="M33 4l-2 6M42 14l-2 6M8 28l-2 6M18 38l-2 6"/></g>`};
/* 게임 타이틀과 같은 도트 글씨 (5×7) */
const F={A:"01110100011000111111100011000110001",B:"11110100011000111110100011000111110",C:"01111100001000010000100001000001111",D:"11110100011000110001100011000111110",E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",G:"01111100001000010111100011000101111",H:"10001100011000111111100011000110001",I:"11111001000010000100001000010011111",K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",M:"10001110111010110101100011000110001",N:"10001110011010110011100011000110001",O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",R:"11110100011000111110101001001010001",S:"01111100001000001110000010000111110",T:"11111001000010000100001000010000100",U:"10001100011000110001100011000101110",W:"10001100011000110101101011010101010",Y:"10001100010101000100001000010000100"};
const PAL=["#e8284f","#f26a0d","#f2b000","#10b870","#00a8e0","#2a5ef0","#8a3cf0"];
function dots(word){const c=10;let o="",x=0,k=0;for(const ch of word){if(ch===" "){x+=c*3;continue}const g=F[ch],col=PAL[k++%7];if(g)for(let y=0;y<7;y++)for(let i=0;i<5;i++)o+=`<circle cx="${x+i*c+c/2}" cy="${y*c+c/2}" r="${c*.4}" fill="${g[y*5+i]==="1"?col:"rgba(255,255,255,.06)"}"/>`;x+=c*6}
 return `<svg viewBox="0 0 ${x-c} ${7*c}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${word}">${o}</svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ARR='<svg viewBox="0 0 6 10" shape-rendering="crispEdges" fill="currentColor"><rect x="0" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="2" height="2"/></svg>';
document.getElementById("list").innerHTML=G.map(g=>`<a class="it" style="--c:${g.c}" href="/${g.id}/"><span class="ic"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${SYM[g.id]||""}</svg></span><div class="tx"><div class="nm"><b>${esc(g.nm)}</b><i>${g.en}</i></div><div class="ds">${esc(g.ds)}</div><div class="tg">${g.nw?'<span class="nw">NEW</span>':""}${g.tg.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div><span class="pl">PLAY</span></a>`).join("");
const RB=["#e8284f","#f26a0d","#f2b000","#10b870","#00a8e0","#3a5bd9","#8a3cf0"];
["rb1","rb2"].forEach(id=>{const el=document.getElementById(id);let h="";for(let r=0;r<2;r++)for(let c=0;c<21;c++)h+=`<i style="background:${RB[(c+r*3)%7]}"></i>`;el.innerHTML=h});
try{if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.getElementById("inst").remove()}catch(e){}
</script>
</body>
</html>
