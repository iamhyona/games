<script>

 {id:"fruitpang",en:"MARBLE PANG",nm:"구슬팡",c:"#ff6ec7",ds:"같은 구슬 합쳐서 오로라볼까지!",tg:["타임어택","스코어","랭킹"],nw:1},
 {id:"farm",en:"PANG FARM",nm:"팡팡농장",c:"#7cc95a",ds:"팡팡이와 나만의 농장 가꾸기",tg:["농사","힐링","방치"],nw:1},

 {id:"mines",en:"MINESWEEPER",nm:"지뢰찾기",c:"#6ea0ff",ds:"숫자 보고 지뢰를 피해 가요",tg:["클래식","랭킹"]},
 {id:"pang",en:"PANGYA PANGYA",nm:"팡야팡야",c:"#ff6b9a",ds:"같은 모양 넷이면 연쇄 팡!",tg:["연쇄","퍼즐","대결"]},

 {id:"peekaboo",en:"PEEKABOO",nm:"틀린그림 · 숨은그림",c:"#8fd3ff",ds:"다른 곳과 숨은 물건 찾기",tg:["찾기","랭킹"],nw:1,hide:1},
 {id:"hangulbi",en:"HANGULBI",nm:"한글비타자게임",c:"#3fc9b0",ds:"헷갈리는 우리말이 비처럼!",tg:["타자","우리말"]}];

const IC={farm:"icon-180.png",kart:"icon-180.png",petris:"icon-180.png",switchpang:"apple-touch-icon.png",fruitpang:"icon-180.png",mines:"icon-180.png",pang:"apple-touch-icon.png",bricks:"icon-180.png",twinstar:"icon-180.png",peekaboo:"icon-180.png",hangulbi:"apple-touch-icon.png"};
/* 게임 타이틀과 같은 도트 글씨 (5×7) */
const F={A:"01110100011000111111100011000110001",B:"11110100011000111110100011000111110",C:"01111100001000010000100001000001111",D:"11110100011000110001100011000111110",E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",G:"01111100001000010111100011000101111",H:"10001100011000111111100011000110001",I:"11111001000010000100001000010011111",K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",M:"10001110111010110101100011000110001",N:"10001110011010110011100011000110001",O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",R:"11110100011000111110101001001010001",S:"01111100001000001110000010000111110",T:"11111001000010000100001000010000100",U:"10001100011000110001100011000101110",W:"10001100011000110101101011010101010",Y:"10001100010101000100001000010000100"};
const PAL=["#e8284f","#f26a0d","#f2b000","#10b870","#00a8e0","#2a5ef0","#8a3cf0"];
function dots(word){const c=10;let o="",x=0,k=0;for(const ch of word){if(ch===" "){x+=c*3;continue}const g=F[ch],col=PAL[k++%7];if(g)for(let y=0;y<7;y++)for(let i=0;i<5;i++)o+=`<circle cx="${x+i*c+c/2}" cy="${y*c+c/2}" r="${c*.4}" fill="${g[y*5+i]==="1"?col:"rgba(255,255,255,.06)"}"/>`;x+=c*6}
 return `<svg viewBox="0 0 ${x-c} ${7*c}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${word}">${o}</svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ARR='<svg viewBox="0 0 6 10" shape-rendering="crispEdges" fill="currentColor"><rect x="0" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="2" height="2"/></svg>';
document.getElementById("list").innerHTML=G.filter(g=>!g.hide).map(g=>`<a class="it" style="--c:${g.c}" href="/${g.id}/"><span class="ic"><img src="/${g.id}/${IC[g.id]}?v=7" alt="" loading="lazy"></span><div class="tx"><div class="nm"><b>${esc(g.nm)}</b><i>${g.en}</i></div><div class="ds">${esc(g.ds)}</div><div class="tg">${g.nw?'<span class="nw">NEW</span>':""}${g.tg.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div><span class="pl">PLAY</span></a>`).join("");


try{if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.getElementById("inst").remove()}catch(e){}
